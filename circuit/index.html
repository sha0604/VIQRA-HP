<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>VIQRA CIRCUIT</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f7f7f5;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ddd;background:#fff;position:relative;z-index:20}.logo{font-size:20px;font-weight:700;letter-spacing:.16em}.sub{font-size:9px;letter-spacing:.16em;color:#777}#stage{position:relative;height:calc(100dvh - 68px);overflow:hidden;background:radial-gradient(circle at 20% 18%,#fff 0 2px,transparent 3px),linear-gradient(#fafaf8,#ecece8)}.grid{position:absolute;inset:0;background-image:linear-gradient(#00000009 1px,transparent 1px),linear-gradient(90deg,#00000009 1px,transparent 1px);background-size:32px 32px}.machine{position:absolute;inset:0;max-width:760px;margin:auto}.rail{position:absolute;height:7px;background:#222;border-radius:8px;transform-origin:left center;box-shadow:0 2px 0 #0003}.r1{left:7%;top:24%;width:27%;transform:rotate(15deg)}.r2{left:29%;top:32%;width:23%;transform:rotate(-19deg)}.r3{left:48%;top:24%;width:23%;transform:rotate(34deg)}.r4{left:65%;top:37%;width:20%;transform:rotate(-12deg)}.r5{left:69%;top:54%;width:18%;transform:rotate(50deg)}#ball{position:absolute;width:22px;height:22px;border-radius:50%;background:#111;box-shadow:0 4px 10px #0004;left:6%;top:18%;z-index:9}.dominoes{position:absolute;left:22%;top:33%;display:flex;gap:9px;transform:rotate(-8deg)}.domino{width:8px;height:34px;border-radius:3px;background:#333;transform-origin:bottom;box-shadow:1px 2px 0 #0003;transition:transform .25s ease}.gear{position:absolute;border:5px solid #222;border-radius:50%;background:#eee;display:grid;place-items:center;transition:transform 1.2s linear}.gear:before{content:"";width:24%;height:24%;border:4px solid #222;border-radius:50%;background:#fff}.g1{left:47%;top:39%;width:74px;height:74px}.g2{left:58%;top:43%;width:50px;height:50px}.lever{position:absolute;left:68%;top:29%;width:82px;height:8px;background:#222;border-radius:8px;transform:rotate(28deg);transform-origin:left;transition:transform .6s ease}.cup{position:absolute;left:76%;top:61%;width:58px;height:42px;border:4px solid #222;border-top:0;border-radius:0 0 14px 14px}.target{position:absolute;left:81%;top:72%;width:46px;height:46px;border:4px solid #222;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}.target.hit{background:#171717;color:#fff;transform:scale(1.12);transition:.25s}.cover{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#f7f7f5ee;backdrop-filter:blur(6px);touch-action:auto}.card{text-align:center;padding:28px}.card h1{margin:0 0 8px;font-size:29px;letter-spacing:.12em}.card p{margin:0 0 24px;color:#666;font-size:12px;letter-spacing:.08em}button{position:relative;z-index:60;border:0;background:#171717;color:#fff;border-radius:999px;padding:15px 30px;font-weight:700;letter-spacing:.14em;font-size:12px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#777;font-size:9px;letter-spacing:.1em}.done{position:absolute;inset:0;display:none;z-index:45;place-items:center;background:#fff9;backdrop-filter:blur(4px)}.done strong{font-size:42px;letter-spacing:.2em}.done small{display:block;margin-top:10px;color:#777;letter-spacing:.16em;text-align:center}@media(max-width:520px){.sub{font-size:8px}.rail{height:6px}.domino{height:29px}.g1{width:62px;height:62px}.g2{width:43px;height:43px}.lever{width:68px}.card h1{font-size:25px}}</style></head><body><header><div class="logo">VIQRA</div><div class="sub">CIRCUIT / PROTOTYPE 01</div></header><main id="stage"><div class="grid"></div><div class="machine"><div class="rail r1"></div><div class="rail r2"></div><div class="rail r3"></div><div class="rail r4"></div><div class="rail r5"></div><div class="dominoes" id="dominoes"></div><div class="gear g1" id="g1"></div><div class="gear g2" id="g2"></div><div class="lever" id="lever"></div><div class="cup"></div><div class="target" id="target">V</div><div id="ball"></div></div><div class="hint">30 SEC CIRCUIT / TOUCH-FRIENDLY PROTOTYPE</div><div class="cover" id="cover"><div class="card"><h1>VIQRA CIRCUIT</h1><p>つながりから、次の仕掛けへ。</p><button id="start">START</button></div></div><div class="done" id="done"><div><strong>VIQRA</strong><small>THE CONNECTION CONTINUES.</small></div></div></main><script>const ball=document.querySelector('#ball'),cover=document.querySelector('#cover'),done=document.querySelector('#done'),target=document.querySelector('#target'),g1=document.querySelector('#g1'),g2=document.querySelector('#g2'),lever=document.querySelector('#lever'),dom=document.querySelector('#dominoes');for(let i=0;i<8;i++){const x=document.createElement('i');x.className='domino';dom.appendChild(x)}function run(){cover.style.display='none';done.style.display='none';target.classList.remove('hit');g1.style.transform='rotate(0)';g2.style.transform='rotate(0)';lever.style.transform='rotate(28deg)';ball.style.transition='none';ball.style.left='6%';ball.style.top='18%';[...dom.children].forEach(x=>x.style.transform='rotate(0)');const steps=[[6,18,0],[18,23,650],[31,30,650],[41,25,650],[51,30,650],[61,39,650],[71,45,650],[76,56,650],[81,70,800]];let t=300;steps.slice(1).forEach((s,i)=>{t+=s[2];setTimeout(()=>{ball.style.transition='left .55s ease,top .55s ease';ball.style.left=s[0]+'%';ball.style.top=s[1]+'%'},t);if(i<8)setTimeout(()=>dom.children[i].style.transform='rotate(74deg)',t-280)});setTimeout(()=>{g1.style.transform='rotate(720deg)';g2.style.transform='rotate(-1080deg)';lever.style.transform='rotate(64deg)'},2700);setTimeout(()=>target.classList.add('hit'),5700);setTimeout(()=>done.style.display='grid',6200)}document.querySelector('#start').addEventListener('click',run);document.querySelector('#start').addEventListener('touchend',e=>{e.preventDefault();run()},{passive:false});done.addEventListener('click',run);</script></body></html>
