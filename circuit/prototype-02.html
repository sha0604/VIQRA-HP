<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VIQRA CIRCUIT 02</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eee;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#171717}header{height:64px;background:#fff;border-bottom:1px solid #d8d8d8;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.logo{font-weight:800;letter-spacing:.18em}.sub{font-size:9px;color:#777;letter-spacing:.12em}#scene{position:relative;height:calc(100dvh - 64px);background:linear-gradient(#f8f8f6,#e6e6e2);overflow:hidden}.board{position:absolute;inset:5% 4% 8%;max-width:850px;margin:auto;background:#ddd;border:8px solid #c9c9c5;border-radius:18px;box-shadow:0 18px 40px #0002,inset 0 0 0 2px #fff;overflow:hidden}.wood{position:absolute;inset:0;background:repeating-linear-gradient(7deg,#e7e7e3 0 28px,#e1e1dd 29px 30px)}.track{position:absolute;height:7px;background:#222;border-radius:8px;transform-origin:left center;box-shadow:0 2px 0 #0003}.t1{left:5%;top:18%;width:24%;transform:rotate(12deg)}.t2{left:25%;top:23%;width:18%;transform:rotate(-18deg)}.t3{left:40%;top:18%;width:18%;transform:rotate(28deg)}.t4{left:56%;top:28%;width:18%;transform:rotate(-8deg)}.t5{left:68%;top:38%;width:14%;transform:rotate(48deg)}.t6{left:72%;top:57%;width:14%;transform:rotate(-16deg)}.ball{position:absolute;width:20px;height:20px;border-radius:50%;background:#111;box-shadow:0 4px 8px #0005;z-index:10}.b1{left:4%;top:14%}.b2{left:53%;top:47%;opacity:0}.b3{left:73%;top:66%;opacity:0}.dom{position:absolute;left:22%;top:28%;display:flex;gap:8px;transform:rotate(-10deg)}.d{width:9px;height:38px;background:#292929;border-radius:3px;transform-origin:bottom;transition:.18s}.gear{position:absolute;border:5px solid #222;border-radius:50%;background:#eee;display:grid;place-items:center;transition:transform 1.2s linear}.gear:before{content:"";width:24%;height:24%;border:4px solid #222;border-radius:50%;background:#fff}.g1{left:43%;top:38%;width:80px;height:80px}.g2{left:55%;top:43%;width:54px;height:54px}.rope{position:absolute;background:#333;height:3px;transform-origin:left}.r1{left:49%;top:29%;width:17%;transform:rotate(78deg);transition:transform .7s}.weight{position:absolute;left:63%;top:40%;width:18px;height:36px;background:#333;border-radius:3px;transition:top .7s}.see{position:absolute;left:63%;top:62%;width:23%;height:8px;background:#222;transform:rotate(8deg);transform-origin:center;transition:transform .7s}.see:after{content:"";position:absolute;left:48%;top:7px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:18px solid #333}.spinner{position:absolute;left:15%;bottom:12%;width:74px;height:74px;border:5px solid #222;border-radius:50%;display:grid;place-items:center;transition:transform 1.2s linear}.spinner:before,.spinner:after{content:"";position:absolute;width:5px;height:64px;background:#222}.spinner:after{transform:rotate(90deg)}.gate{position:absolute;right:9%;bottom:13%;width:72px;height:72px;border:5px solid #222;border-radius:50%;display:grid;place-items:center;font-weight:800;transition:.5s}.gate.open{background:#171717;color:#fff;transform:scale(1.12)}.msg{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-size:9px;color:#666;letter-spacing:.14em}.cover{position:absolute;inset:0;z-index:30;background:#f5f5f3ee;display:grid;place-items:center;text-align:center;backdrop-filter:blur(5px)}.cover h1{font-size:28px;letter-spacing:.14em;margin:0 0 8px}.cover p{font-size:11px;color:#666;margin:0 0 20px}.cover button{border:0;border-radius:999px;background:#171717;color:#fff;padding:14px 30px;font-weight:700;letter-spacing:.15em;touch-action:manipulation}.finish{position:absolute;inset:0;z-index:25;display:none;place-items:center;background:#fff9;backdrop-filter:blur(4px)}.finish b{font-size:44px;letter-spacing:.2em}.finish span{display:block;text-align:center;color:#666;font-size:10px;letter-spacing:.15em;margin-top:10px}</style></head><body><header><div class="logo">VIQRA</div><div class="sub">CIRCUIT / PROTOTYPE 02</div></header><main id="scene"><div class="board"><div class="wood"></div><div class="track t1"></div><div class="track t2"></div><div class="track t3"></div><div class="track t4"></div><div class="track t5"></div><div class="track t6"></div><div class="dom" id="dom"></div><div class="gear g1" id="g1"></div><div class="gear g2" id="g2"></div><div class="rope r1" id="rope"></div><div class="weight" id="weight"></div><div class="see" id="see"></div><div class="spinner" id="spinner"></div><div class="gate" id="gate">V</div><div class="ball b1" id="ball1"></div><div class="ball b2" id="ball2"></div><div class="ball b3" id="ball3"></div></div><div class="msg">ONE ACTION → THE NEXT ACTION / TOUCH-FRIENDLY PROTOTYPE</div><div class="cover" id="cover"><div><h1>VIQRA CIRCUIT 02</h1><p>今度は、ちゃんと「つながる」。</p><button id="go">START</button></div></div><div class="finish" id="finish"><div><b>VIQRA</b><span>THE CONNECTION CONTINUES.</span></div></div></main><script>const $=s=>document.querySelector(s);const dom=$('#dom');for(let i=0;i<9;i++){const e=document.createElement('i');e.className='d';dom.appendChild(e)}const b1=$('#ball1'),b2=$('#ball2'),b3=$('#ball3'),g1=$('#g1'),g2=$('#g2'),rope=$('#rope'),weight=$('#weight'),see=$('#see'),spin=$('#spinner'),gate=$('#gate'),cover=$('#cover'),finish=$('#finish');function move(el,left,top,d=650){el.style.transition=`left ${d}ms cubic-bezier(.2,.8,.2,1),top ${d}ms cubic-bezier(.2,.8,.2,1)`;el.style.left=left;el.style.top=top}function run(){cover.style.display='none';finish.style.display='none';gate.classList.remove('open');b1.style.left='4%';b1.style.top='14%';b2.style.opacity=0;b3.style.opacity=0;[...dom.children].forEach(x=>x.style.transform='rotate(0)');g1.style.transform='rotate(0)';g2.style.transform='rotate(0)';rope.style.transform='rotate(78deg)';weight.style.top='40%';see.style.transform='rotate(8deg)';spin.style.transform='rotate(0)';setTimeout(()=>move(b1,'22%','20%'),500);setTimeout(()=>{dom.children[0].style.transform='rotate(72deg)'},1100);for(let i=1;i<9;i++)setTimeout(()=>dom.children[i].style.transform='rotate(72deg)',1100+i*190);setTimeout(()=>move(b1,'39%','18%'),3000);setTimeout(()=>{g1.style.transform='rotate(540deg)';g2.style.transform='rotate(-810deg)'},3500);setTimeout(()=>{rope.style.transform='rotate(102deg)';weight.style.top='53%'},4100);setTimeout(()=>{see.style.transform='rotate(-13deg)'},4700);setTimeout(()=>{b2.style.opacity=1;move(b2,'68%','57%',700)},5100);setTimeout(()=>{spin.style.transform='rotate(540deg)'},5800);setTimeout(()=>{b3.style.opacity=1;move(b3,'82%','67%',750)},6500);setTimeout(()=>gate.classList.add('open'),7300);setTimeout(()=>finish.style.display='grid',7900)}$('#go').addEventListener('click',run);$('#go').addEventListener('touchend',e=>{e.preventDefault();run()},{passive:false});finish.addEventListener('click',run);</script></body></html>
